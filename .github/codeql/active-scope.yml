name: Encore vendor maintained source — CodeQL
# Candidate scope for *all* maintained override source directories.
# This file does NOT configure CodeQL merely by existing: Default Setup must
# explicitly reference it through an effective GitHub security configuration.
# Immutable upstream source snapshots under sources/ still require dependency
# and compiled-runtime reachability triage; excluding them is not proof of safety.
paths:
  - .github
  - encore-active
paths-ignore:
  - 'encore-active/**/fixtures/**'
  - 'encore-active/**/tests/data/**'
