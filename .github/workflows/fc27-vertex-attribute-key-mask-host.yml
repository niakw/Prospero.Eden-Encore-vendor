name: FC27 partial vertex-attribute pipeline key research

on:
  push:
    branches: [research/fc27-partial-vertex-attribute-key-20261118]
    paths:
      - 'tests/fc27_vertex_attribute_key_mask_host.py'
      - 'encore-active/eden-vulkan/fixed_pipeline_state.cpp'
      - 'encore-active/eden-vulkan/vk_pipeline_cache_cost.cpp'
      - 'encore-active/eden-shader/src/shader_recompiler/shader_info.h'
      - 'encore-active/eden-shader/src/shader_recompiler/ir_opt/collect_shader_info_pass.cpp'
      - '.github/workflows/fc27-vertex-attribute-key-mask-host.yml'
  pull_request:
    paths:
      - 'tests/fc27_vertex_attribute_key_mask_host.py'
      - 'encore-active/eden-vulkan/fixed_pipeline_state.cpp'
      - 'encore-active/eden-vulkan/vk_pipeline_cache_cost.cpp'
      - 'encore-active/eden-shader/src/shader_recompiler/shader_info.h'
      - 'encore-active/eden-shader/src/shader_recompiler/ir_opt/collect_shader_info_pass.cpp'
      - '.github/workflows/fc27-vertex-attribute-key-mask-host.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fc27-vertex-attribute-key-mask-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  negative-control-and-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reproduce current key split and validate candidate mask
        run: python3 -B tests/fc27_vertex_attribute_key_mask_host.py
      - name: Diff hygiene
        run: git diff --check
