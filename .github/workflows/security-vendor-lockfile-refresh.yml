name: Security vendor archived docs lockfiles (one-shot)
on:
  push:
    branches: [security/codeql-dependabot-triage-20261112]
    paths: [.github/workflows/security-vendor-lockfile-refresh.yml]
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - name: Update dependency resolution only, never execute vendor scripts
        shell: bash
        run: |
          set -euo pipefail
          for directory in \
            sources/eden-cpm/boost/boost-1.90.0/libs/msm/doc \
            sources/eden-cpm/boost/boost-1.90.0/libs/openmethod/doc \
            sources/eden-cpm/boost/boost-1.90.0/libs/url/doc; do
            [[ -f "$directory/package-lock.json" ]]
            echo "AUDIT_LOCK $directory"
            (
              cd "$directory"
              npm audit fix --package-lock-only --ignore-scripts --no-fund || true
              npm ls --package-lock-only --all --depth=0 >/dev/null 2>&1 || true
            )
          done
          git diff --check
          python3 - <<'PY'
          import json
          from pathlib import Path
          roots = [
              Path("sources/eden-cpm/boost/boost-1.90.0/libs/msm/doc"),
              Path("sources/eden-cpm/boost/boost-1.90.0/libs/openmethod/doc"),
              Path("sources/eden-cpm/boost/boost-1.90.0/libs/url/doc"),
          ]
          for root in roots:
              lock = json.loads((root/"package-lock.json").read_text())
              manifest = json.loads((root/"package.json").read_text())
              assert lock.get("lockfileVersion", 0) >= 2
              assert isinstance(lock.get("packages"), dict)
              print(f"VALID_LOCK {root} nodes={len(lock['packages'])}")
          PY
          git add -- \
            sources/eden-cpm/boost/boost-1.90.0/libs/msm/doc/package-lock.json \
            sources/eden-cpm/boost/boost-1.90.0/libs/openmethod/doc/package-lock.json \
            sources/eden-cpm/boost/boost-1.90.0/libs/url/doc/package-lock.json
          if git diff --staged --quiet; then
            echo "NO_SAFE_LOCK_UPDATES"
            exit 0
          fi
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git commit -m "security(Dependabot): refresh archived Boost docs lockfiles without running scripts"
          # The PR branch may have advanced while the registry audit ran.
          # Rebase the three lockfiles onto its live tip before an ordinary push.
          git fetch origin security/codeql-dependabot-triage-20261112
          git rebase FETCH_HEAD
          git push origin HEAD:security/codeql-dependabot-triage-20261112
