name: NS1 R23 Vulkan texel binding no unknown format (host)
on:
  push:
    branches:
      - research/ns1-r23-vk-texel-format-20261111
  pull_request:
    paths:
      - "encore-active/eden-vulkan/include/video_core/renderer_vulkan/vk_buffer_cache.h"
      - "tests/ns1_r23_49_texel_bind.py"
      - ".github/workflows/ns1-r23-texel-bind.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checked-descriptor-paths:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -B tests/ns1_r23_49_texel_bind.py
