name: NS1 R23 x64 CMPXCHG16B SSE2 register guard (host)
on:
  push:
    branches:
      - research/ns1-r23-x64-cmpxchg16b-guard-20261111
  pull_request:
    paths:
      - "encore-active/eden-core/src/dynarmic/backend/x64/emit_x64_memory.h"
      - "tests/ns1_r23_41_x64_cmpxchg.py"
      - ".github/workflows/ns1-r23-x64-cmpxchg.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  xmm0-clobber:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -B tests/ns1_r23_41_x64_cmpxchg.py
