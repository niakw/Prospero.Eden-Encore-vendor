name: PS5 active texture page publication
on:
  pull_request:
    paths:
      - 'encore-active/ns2-astc/include/video_core/texture_cache/texture_cache.h'
      - 'encore-active/eden-vulkan/vulkan-cache/video_core/texture_cache/texture_cache.h'
      - 'tests/ps5_active_texture_page_publication_source.py'
      - 'tests/fc27_vic_texture_invalidation_source.py'
      - 'encore-active/eden-core/src/video_core/host1x/vic.cpp'
      - 'encore-active/eden-core/overrides/core/guest_memory.h'
      - 'encore-active/eden-vulkan/vulkan_rasterizer.cpp'
      - '.github/workflows/ps5-active-texture-pages-host.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify selected PS5 TextureCache publishes page ownership
        run: python3 -B tests/ps5_active_texture_page_publication_source.py
      - name: Verify VIC output reaches the same invalidation contract
        run: python3 -B tests/fc27_vic_texture_invalidation_source.py
