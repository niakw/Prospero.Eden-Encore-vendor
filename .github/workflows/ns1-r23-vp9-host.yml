name: NS1 R23 VP9 frame segmentation source tests
on:
  push:
    branches:
      - research/ns1-r23-vp9-segmentation-20261111
  pull_request:
    paths:
      - "encore-active/eden-core/src/video_core/host1x/**"
      - "tests/ns1_r23_48_vp9_host.py"
      - ".github/workflows/ns1-r23-vp9-host.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  maintained-two-source-vp9:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -B tests/ns1_r23_48_vp9_host.py
