name: NS2 extracted update ExeFS/RomFS selection (host/source only)
on:
  pull_request:
    paths:
      - '.github/workflows/ns2-extracted-update-romfs-host.yml'
      - 'encore-active/ns2-runtime/metadata/core/loader/deconstructed_rom_directory.cpp'
      - 'tests/ns2-extracted-update-romfs-source.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/ns2-extracted-update-romfs-host.yml'
      - 'encore-active/ns2-runtime/metadata/core/loader/deconstructed_rom_directory.cpp'
      - 'tests/ns2-extracted-update-romfs-source.py'
permissions:
  contents: read
jobs:
  selected-ns2-loader:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: |
            tests/ns2-extracted-update-romfs-source.py
            encore-active/ns2-runtime/metadata/core/loader/deconstructed_rom_directory.cpp
      - name: Verify selected NS2 loader base/update/standalone ownership
        run: python3 -B tests/ns2-extracted-update-romfs-source.py
