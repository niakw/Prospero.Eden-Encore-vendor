name: NS1 R23 bundled parent-program source parity and host tests
on:
  push:
    branches:
      - research/ns1-r23-parent-program-resources-20261111
  pull_request:
    paths:
      - "encore-active/eden-core/src/core/file_sys/**"
      - "encore-active/eden-core/include/core/file_sys/**"
      - "tests/ns1_r23_113_parent_programs.py"
      - ".github/workflows/ns1-r23-parent-programs.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  parent-programs:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -B tests/ns1_r23_113_parent_programs.py
