name: NS1 R23 HID per-player connection source semantics
on:
  push:
    branches:
      - research/ns1-r23-hid-controller-connect-20261111
  pull_request:
    paths:
      - "encore-active/eden-core/src/hid_core/frontend/emulated_controller.cpp"
      - "encore-active/eden-core/include/hid_core/frontend/emulated_controller.h"
      - "tests/ns1_r23_95_hid_connected.py"
      - ".github/workflows/ns1-r23-95-hid.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  selected-hid-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -B tests/ns1_r23_95_hid_connected.py
