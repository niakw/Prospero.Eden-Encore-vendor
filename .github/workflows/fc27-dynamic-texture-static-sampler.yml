name: FC27 dynamic texture table with fixed sampler (host)
on:
  pull_request:
    paths:
      - 'encore-active/eden-shader/src/shader_recompiler/ir_opt/texture_pass.cpp'
      - 'encore-active/eden-vulkan/vk_graphics_pipeline_cost.cpp'
      - 'encore-active/eden-vulkan/vk_compute_pipeline_cost.cpp'
      - 'encore-active/eden-vulkan/vk_pipeline_cache_cost.cpp'
      - 'tests/fc27_dynamic_texture_static_sampler_host.py'
      - 'tests/fc27_xmad_pointer_fold_host.py'
      - 'tests/ns1_r23_35_attribute_handle.py'
      - 'tests/ns1_r23_58_bindless_phi.py'
      - 'tests/ns1_r23_58_conditional_phi.py'
      - 'tests/ns1_r23_2_depth_clip.py'
      - '.github/workflows/fc27-dynamic-texture-static-sampler.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          set -eu
          python3 -B tests/fc27_dynamic_texture_static_sampler_host.py
          python3 -B tests/fc27_xmad_pointer_fold_host.py
          python3 -B tests/ns1_r23_35_attribute_handle.py
          python3 -B tests/ns1_r23_58_bindless_phi.py
          python3 -B tests/ns1_r23_58_conditional_phi.py
          python3 -B tests/ns1_r23_2_depth_clip.py
