name: FC27 CPU-write readback race host contract
on:
  pull_request:
    paths:
      - 'encore-active/eden-core/src/video_core/gpu_vulkan.cpp'
      - 'encore-active/eden-core/src/video_core/gpu_gl_native.cpp'
      - 'encore-active/eden-core/src/video_core/gpu_gl_native_dev.cpp'
      - 'encore-active/eden-core/overrides/core/gpu_dirty_memory_manager.h'
      - 'encore-active/eden-core/src/video_core/buffer_cache/**'
      - 'encore-active/eden-vulkan/**'
      - 'tests/fc27_cpu_write_download_race_host.py'
      - '.github/workflows/fc27-cpu-write-download-race-host.yml'
  push:
    branches: [main]
    paths:
      - 'encore-active/eden-core/src/video_core/gpu_vulkan.cpp'
      - 'encore-active/eden-core/src/video_core/gpu_gl_native.cpp'
      - 'encore-active/eden-core/src/video_core/gpu_gl_native_dev.cpp'
      - 'encore-active/eden-core/overrides/core/gpu_dirty_memory_manager.h'
      - 'encore-active/eden-core/src/video_core/buffer_cache/**'
      - 'encore-active/eden-vulkan/**'
      - 'tests/fc27_cpu_write_download_race_host.py'
      - '.github/workflows/fc27-cpu-write-download-race-host.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify pending CPU-write preservation and complete GPU collector type
        run: python3 -B tests/fc27_cpu_write_download_race_host.py
