name: One-shot branch cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Delete non-main branches
        run: |
          set -euo pipefail
          git push origin --delete audit/ns1-switchbrew-main-coverage-20261122 ns1/reconciled-20261128
