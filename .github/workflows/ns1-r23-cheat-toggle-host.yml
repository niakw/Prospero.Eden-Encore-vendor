name: NS1 R23 runtime cheat synchronized toggle source (host)
on:
  push:
    branches:
      - research/ns1-r23-cheat-parser-bounds-20261111
  pull_request:
    paths:
      - "encore-active/eden-core/src/core/memory/cheat_engine.cpp"
      - "encore-active/eden-core/include/core/memory/cheat_engine.h"
      - "tests/ns1_r23_46_cheat_toggle_host.py"
      - ".github/workflows/ns1-r23-cheat-toggle-host.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runtime-toggle-asan:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -B tests/ns1_r23_46_cheat_toggle_host.py
