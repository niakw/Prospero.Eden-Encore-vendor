name: NS1 R23 JIT x64 source byte parity and host contracts
on:
  push:
    branches:
      - research/ns1-r23-jit-x64-followups-20261111
  pull_request:
    paths:
      - "encore-active/eden-core/src/dynarmic/backend/x64/emit_x64_*.cpp"
      - "tests/ns1_r23_11_jit_x64_provenance.py"
      - ".github/workflows/ns1-r23-jit-x64-host.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-jit-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -B tests/ns1_r23_11_jit_x64_provenance.py
