name: Vendor stb and Vulkan stage warnings (host)
on:
  pull_request:
    paths:
      - 'sources/eden/externals/stb/stb_image_write.h'
      - 'sources/eden/src/video_core/renderer_vulkan/maxwell_to_vk.cpp'
      - 'tests/ns1_vulkan_stage_and_stb_warnings_host.py'
      - '.github/workflows/vendor-warning-semantics-host.yml'
  push:
    branches: [main]
    paths:
      - 'sources/eden/externals/stb/stb_image_write.h'
      - 'sources/eden/src/video_core/renderer_vulkan/maxwell_to_vk.cpp'
      - 'tests/ns1_vulkan_stage_and_stb_warnings_host.py'
      - '.github/workflows/vendor-warning-semantics-host.yml'
permissions:
  contents: read
jobs:
  semantics:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compile and run real writer and stage switch regression
        run: python3 -B tests/ns1_vulkan_stage_and_stb_warnings_host.py
      - name: Reject whitespace damage
        run: git diff --check
