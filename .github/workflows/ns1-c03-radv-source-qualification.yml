name: NS1 C03 RADV seven-site source parity (no native build)

on:
  push:
    branches:
      - research/ns1-c03-radv-transfer-barrier-20261111
  pull_request:
    paths:
      - "encore-active/ps5-mesa/src/amd/vulkan/radv_cmd_buffer.c"
      - "encore-active/ps5-mesa/src/amd/vulkan/meta/radv_meta_buffer.c"
      - "encore-active/ps5-mesa/src/amd/vulkan/meta/radv_meta_copy.c"
      - "tests/c03_radv_transfer_split.py"
      - ".github/workflows/ns1-c03-radv-source-qualification.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  immutable-original-vs-maintained:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Checkout exact C03 candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify no pristine Mesa source changed and all seven split sites
        run: python3 -B tests/c03_radv_transfer_split.py
