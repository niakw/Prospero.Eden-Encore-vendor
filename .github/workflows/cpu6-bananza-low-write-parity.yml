name: CPU6 Bananza low-write selected-owner parity
on:
  pull_request:
    paths:
      - 'encore-active/eden/src/core/arm/dynarmic/g11/arm_dynarmic_64_native_normal.cpp'
      - 'encore-active/ns2-runtime/cpu6/maintained/core/arm/dynarmic/arm_dynarmic_64.cpp'
      - 'tests/cpu6_bananza_low_write_parity_host.py'
      - '.github/workflows/cpu6-bananza-low-write-parity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -B tests/cpu6_bananza_low_write_parity_host.py
