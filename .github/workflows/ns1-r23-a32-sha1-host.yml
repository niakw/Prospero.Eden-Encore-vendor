name: NS1 R23 A32 SHA1 exact four-source parity
on:
  push:
    branches:
      - research/ns1-r23-a32-sha1-20261111
  pull_request:
    paths:
      - "encore-active/eden-core/src/dynarmic/frontend/A32/**"
      - "tests/ns1_r23_11_a32_source.py"
      - ".github/workflows/ns1-r23-a32-sha1-host.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  six-sha1-opcodes:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -B tests/ns1_r23_11_a32_source.py
