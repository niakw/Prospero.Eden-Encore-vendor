name: R09 FSwin chain scratch — isolated vendor host proof

# This PR intentionally contains a native experimental path, but it is
# NOT defined in a shipping CMake target and never builds a PS5 artifact.
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/r09-fswin-scratch-host.yml'
      - 'encore-active/eden-vulkan/include/rdna2_nr_fswin_scratch_pool_policy.h'
      - 'encore-active/eden-vulkan/include/video_core/renderer_vulkan/nr_rdna2_fswin_chain.h'
      - 'encore-active/eden-vulkan/include/video_core/renderer_vulkan/nr_rdna2_fswin_layer_runtime.h'
      - 'encore-active/eden-vulkan/include/video_core/renderer_vulkan/nr_rdna2_fswin_gpu_tensors.h'
      - 'encore-active/eden-vulkan/nr_rdna2_fswin_chain.cpp'
      - 'encore-active/eden-vulkan/nr_rdna2_fswin_layer_runtime.cpp'
      - 'encore-active/eden-vulkan/nr_rdna2_fswin_gpu_tensors.cpp'
      - 'tools/check_r09_fswin_scratch_native_owners.py'
      - 'tools/extract_r09_fswin_shared_tensor.py'
      - 'tools/test_r09_fswin_scratch_pool_policy.cpp'
      - 'tools/test_r09_fswin_shared_tensor_extracted.cpp'
      - 'tools/r09_fswin_scratch_synthetic.comp'
      - 'tools/r09_fswin_scratch_vulkan_smoke.cpp'
      - 'tools/r09_fswin_chain_pool_vulkan_graph_smoke.cpp'
      - 'tools/r09_fswin_native_dense_pool_compare.cpp'
      - 'tools/r09_fswin_native_attention_pool_compare.cpp'
      - 'encore-active/eden-vulkan/r09_rdna2_nr/fswin_qkv_rdna2.comp'
      - 'encore-active/eden-vulkan/r09_rdna2_nr/window_attention_rdna2.comp'
      - 'encore-active/eden-vulkan/r09_rdna2_nr/fswin_dense_rdna2.comp'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r09-fswin-scratch-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

jobs:
  experimental-host:
    name: FSwin native borrowed-tensor method and layout (NO PS5 build)
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout isolated PR SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          submodules: false
          persist-credentials: false
      - name: Verify source ownership, barriers, and failure mutations
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tools/check_r09_fswin_scratch_native_owners.py
      - name: Compile self-contained layout policy under GCC and Clang UBSan
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .build-r09-fswin
          for cxx in g++ clang++; do
            for enabled in 0 1; do
              "$cxx" -std=c++20 -O1 -Wall -Wextra -Werror -UNDEBUG \
                -fsanitize=undefined -fno-sanitize-recover=all \
                -DEDEN_R09_MIN_FSWIN_SCRATCH_POOL_EXPERIMENTAL="$enabled" \
                -Iencore-active/eden-vulkan/include \
                tools/test_r09_fswin_scratch_pool_policy.cpp \
                -o ".build-r09-fswin/policy-${cxx}-${enabled}"
              UBSAN_OPTIONS=halt_on_error=1 \
                ".build-r09-fswin/policy-${cxx}-${enabled}"
              echo "R09_FSWIN_SCRATCH_POLICY_CI_PASS cxx=${cxx} opt_in=${enabled}"
            done
          done
      - name: Compile REAL native tensor allocator and descriptor methods
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tools/extract_r09_fswin_shared_tensor.py \
            encore-active/eden-vulkan/nr_rdna2_fswin_gpu_tensors.cpp \
            .build-r09-fswin/r09_fswin_shared_tensor_extracted.h
          for cxx in g++ clang++; do
            "$cxx" -std=c++20 -O1 -Wall -Wextra -Werror -UNDEBUG \
              -fsanitize=undefined -fno-sanitize-recover=all \
              -DEDEN_R09_MIN_FSWIN_SCRATCH_POOL_EXPERIMENTAL=1 \
              -I.build-r09-fswin \
              -Iencore-active/eden-vulkan/include \
              tools/test_r09_fswin_shared_tensor_extracted.cpp \
              -o ".build-r09-fswin/native-${cxx}"
            UBSAN_OPTIONS=halt_on_error=1 \
              ".build-r09-fswin/native-${cxx}"
            echo "R09_FSWIN_SCRATCH_NATIVE_CPP_CI_PASS cxx=${cxx}"
          done
          echo R09_FSWIN_SCRATCH_EXTRACTED_NATIVE_PASS_NOT_FULL_VENDOR_COMPILE
          echo R09_FSWIN_SCRATCH_NATIVE_GPU_PATH_STILL_UNQUALIFIED

      - name: Execute real host Vulkan 1.1 shared-scratch readback and negative sync oracle
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            glslang-tools spirv-tools libvulkan-dev \
            mesa-vulkan-drivers vulkan-validationlayers
          glslangValidator -V --target-env vulkan1.1 -S comp \
            tools/r09_fswin_scratch_synthetic.comp \
            -o .build-r09-fswin/scratch_synthetic.spv
          spirv-val --target-env vulkan1.1 \
            .build-r09-fswin/scratch_synthetic.spv
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -UNDEBUG \
            tools/r09_fswin_scratch_vulkan_smoke.cpp -lvulkan \
            -o .build-r09-fswin/fswin-vulkan-smoke
          icd="$(find /usr/share/vulkan/icd.d -maxdepth 1 \
            -type f -name 'lvp_icd*.json' -print -quit)"
          test -n "$icd" && test -f "$icd"
          export VK_ICD_FILENAMES="$icd"
          .build-r09-fswin/fswin-vulkan-smoke \
            .build-r09-fswin/scratch_synthetic.spv
          R09_FSWIN_VALIDATE_SYNC=1 \
            .build-r09-fswin/fswin-vulkan-smoke \
              .build-r09-fswin/scratch_synthetic.spv
          # Intentionally unsafe, validation-only. Never inspect/read the
          # resulting undefined GPU output from a missing dependency.
          R09_FSWIN_VALIDATE_SYNC=1 \
            .build-r09-fswin/fswin-vulkan-smoke \
              .build-r09-fswin/scratch_synthetic.spv \
              --negative-missing-barrier
          echo R09_FSWIN_REAL_VULKAN_SHARED_SCRATCH_AND_KHRONOS_POS_NEG_PASS
          echo R09_FSWIN_SYNTHETIC_ONLY_NO_MODEL_NO_PS5

      - name: Exercise eight independent scratch pools across 44 and 16 synthetic Vulkan layers
        shell: bash
        run: |
          set -euo pipefail
          # Reuse already installed Vulkan, Mesa, glslang, SPIR-V validation.
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -UNDEBUG \
            tools/r09_fswin_chain_pool_vulkan_graph_smoke.cpp -lvulkan \
            -o .build-r09-fswin/graph-vulkan-smoke
          icd="$(find /usr/share/vulkan/icd.d -maxdepth 1 \
            -type f -name 'lvp_icd*.json' -print -quit)"
          test -n "$icd" && test -f "$icd"
          export VK_ICD_FILENAMES="$icd"
          for model in Original Compact; do
            .build-r09-fswin/graph-vulkan-smoke \
              .build-r09-fswin/scratch_synthetic.spv "$model"
            R09_FSWIN_VALIDATE_SYNC=1 \
              .build-r09-fswin/graph-vulkan-smoke \
                .build-r09-fswin/scratch_synthetic.spv "$model"
          done
          R09_FSWIN_VALIDATE_SYNC=1 \
            .build-r09-fswin/graph-vulkan-smoke \
              .build-r09-fswin/scratch_synthetic.spv Original \
              --negative-missing-barrier
          echo R09_FSWIN_EIGHT_SEGMENT_44_AND_16_LAYER_GPU_HOST_PASS
          echo R09_FSWIN_EIGHT_CHAIN_SYNTHETIC_GPU_QUALIFIED

      - name: Compare genuine RDNA2 FSwin Dense shader stages with private versus pooled scratch
        shell: bash
        run: |
          set -euo pipefail
          glslangValidator -V --target-env vulkan1.1 -S comp \
            encore-active/eden-vulkan/r09_rdna2_nr/fswin_dense_rdna2.comp \
            -o .build-r09-fswin/fswin_dense_native.spv
          spirv-val --target-env vulkan1.1 \
            .build-r09-fswin/fswin_dense_native.spv
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -UNDEBUG \
            tools/r09_fswin_native_dense_pool_compare.cpp -lvulkan \
            -o .build-r09-fswin/native-dense-pool-ab
          icd="$(find /usr/share/vulkan/icd.d -maxdepth 1 \
            -type f -name 'lvp_icd*.json' -print -quit)"
          test -n "$icd" && test -f "$icd"
          VK_ICD_FILENAMES="$icd" \
            .build-r09-fswin/native-dense-pool-ab \
              .build-r09-fswin/fswin_dense_native.spv
          VK_ICD_FILENAMES="$icd" R09_FSWIN_VALIDATE_SYNC=1 \
            .build-r09-fswin/native-dense-pool-ab \
              .build-r09-fswin/fswin_dense_native.spv
          echo R09_FSWIN_AUTHENTIC_DENSE_STAGE0_2_GPU_AB_AND_KHRONOS_PASS
          echo R09_FSWIN_NATIVE_DENSE_0_2_GPU_AND_KHRONOS_PASS

      - name: Compare genuine QKV + window attention shaders using pooled/private VkBuffers
        shell: bash
        run: |
          set -euo pipefail
          glslangValidator -V --target-env vulkan1.1 -S comp \
            encore-active/eden-vulkan/r09_rdna2_nr/fswin_qkv_rdna2.comp \
            -o .build-r09-fswin/fswin_qkv_native.spv
          spirv-val --target-env vulkan1.1 \
            .build-r09-fswin/fswin_qkv_native.spv
          glslangValidator -V --target-env vulkan1.1 -S comp \
            encore-active/eden-vulkan/r09_rdna2_nr/window_attention_rdna2.comp \
            -o .build-r09-fswin/window_attention_native.spv
          spirv-val --target-env vulkan1.1 \
            .build-r09-fswin/window_attention_native.spv
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -UNDEBUG \
            tools/r09_fswin_native_attention_pool_compare.cpp -lvulkan \
            -o .build-r09-fswin/native-attention-pool-ab
          icd="$(find /usr/share/vulkan/icd.d -maxdepth 1 \
            -type f -name 'lvp_icd*.json' -print -quit)"
          test -n "$icd" && test -f "$icd"
          export VK_ICD_FILENAMES="$icd"
          .build-r09-fswin/native-attention-pool-ab \
            .build-r09-fswin/fswin_qkv_native.spv \
            .build-r09-fswin/window_attention_native.spv \
            .build-r09-fswin/fswin_dense_native.spv
          R09_FSWIN_VALIDATE_SYNC=1 \
            .build-r09-fswin/native-attention-pool-ab \
              .build-r09-fswin/fswin_qkv_native.spv \
              .build-r09-fswin/window_attention_native.spv \
              .build-r09-fswin/fswin_dense_native.spv
          echo R09_FSWIN_REAL_QKV_ATTENTION_DENSE3_GPU_AB_KHRONOS_PASS
          echo R09_FSWIN_PUBLIC_FIXTURES_ONLY_NO_FULL_NEURAL_MODEL_OR_PS5

  authentic-native-syntax:
    name: Three REAL FSwin C++ TUs (macro OFF/ON, no PS5 build)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact FSwin candidate vendor PR SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: candidate
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          submodules: false
          persist-credentials: false
      - name: Checkout reviewed Encore source and all PINNED deps
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: niakw/ProsperoEden-Encore
          ref: 0ad39a21b1de67f9ff055d6fd6f1f7c97dde12d5
          path: encore
          fetch-depth: 1
          submodules: recursive
          persist-credentials: false
      - name: Temporarily stage exact scratch candidate without touching the engine pin
        shell: bash
        run: |
          set -euo pipefail
          pinned=22b69d6053db41b74edac2633c012f925b84f69e
          candidate="$(git -C candidate rev-parse HEAD)"
          test "$(git -C encore rev-parse HEAD:vendor)" = "$pinned"
          test "$(git -C encore/vendor rev-parse HEAD)" = "$pinned"
          git -C encore/vendor -c credential.helper= fetch --quiet --depth=1 origin "$candidate"
          git -C encore/vendor checkout --quiet --detach "$candidate"
          test "$(git -C encore/vendor rev-parse HEAD)" = "$candidate"
          test "$(git -C encore rev-parse HEAD:vendor)" = "$pinned"
          test -f encore/vendor/encore-active/eden-vulkan/include/rdna2_nr_fswin_scratch_pool_policy.h
          echo "R09_FSWIN_AUTHENTIC_TU_PAIR encore=$(git -C encore rev-parse HEAD) vendor_candidate=$candidate pinned_submodule=$pinned"
      - name: Install host Vulkan, SPIR-V and FFmpeg headers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            clang glslang-tools spirv-tools libvulkan-dev \
            libavcodec-dev libavutil-dev libswscale-dev
      - name: Syntax-check exact three native FSwin source owners twice
        shell: bash
        working-directory: encore
        run: |
          set -euo pipefail
          R09_FSWIN_NATIVE_TU_DUAL=1 \
            python3 -B tools/graphics/check-rdna2-neural-vulkan-tus.py
          test "$(git rev-parse HEAD:vendor)" = "22b69d6053db41b74edac2633c012f925b84f69e"
          echo R09_FSWIN_AUTHENTIC_CPP_SYNTAX_PASS_NO_PS5_BUILD_NO_PIN_CHANGE
