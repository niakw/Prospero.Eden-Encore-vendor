name: R09 FSwin chain scratch — isolated vendor host proof

# This PR intentionally contains a native experimental path, but it is
# NOT defined in a shipping CMake target and never builds a PS5 artifact.
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/r09-fswin-scratch-host.yml'
      - 'encore-active/eden-vulkan/include/rdna2_nr_fswin_scratch_pool_policy.h'
      - 'encore-active/eden-vulkan/include/video_core/renderer_vulkan/nr_rdna2_fswin_chain.h'
      - 'encore-active/eden-vulkan/include/video_core/renderer_vulkan/nr_rdna2_fswin_layer_runtime.h'
      - 'encore-active/eden-vulkan/include/video_core/renderer_vulkan/nr_rdna2_fswin_gpu_tensors.h'
      - 'encore-active/eden-vulkan/nr_rdna2_fswin_chain.cpp'
      - 'encore-active/eden-vulkan/nr_rdna2_fswin_layer_runtime.cpp'
      - 'encore-active/eden-vulkan/nr_rdna2_fswin_gpu_tensors.cpp'
      - 'tools/check_r09_fswin_scratch_native_owners.py'
      - 'tools/extract_r09_fswin_shared_tensor.py'
      - 'tools/test_r09_fswin_scratch_pool_policy.cpp'
      - 'tools/test_r09_fswin_shared_tensor_extracted.cpp'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r09-fswin-scratch-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

jobs:
  experimental-host:
    name: FSwin native borrowed-tensor method and layout (NO PS5 build)
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout isolated PR SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          submodules: false
          persist-credentials: false
      - name: Verify source ownership, barriers, and failure mutations
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tools/check_r09_fswin_scratch_native_owners.py
      - name: Compile self-contained layout policy under GCC and Clang UBSan
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .build-r09-fswin
          for cxx in g++ clang++; do
            for enabled in 0 1; do
              "$cxx" -std=c++20 -O1 -Wall -Wextra -Werror -UNDEBUG \
                -fsanitize=undefined -fno-sanitize-recover=all \
                -DEDEN_R09_MIN_FSWIN_SCRATCH_POOL_EXPERIMENTAL="$enabled" \
                -Iencore-active/eden-vulkan/include \
                tools/test_r09_fswin_scratch_pool_policy.cpp \
                -o ".build-r09-fswin/policy-${cxx}-${enabled}"
              UBSAN_OPTIONS=halt_on_error=1 \
                ".build-r09-fswin/policy-${cxx}-${enabled}"
              echo "R09_FSWIN_SCRATCH_POLICY_CI_PASS cxx=${cxx} opt_in=${enabled}"
            done
          done
      - name: Compile REAL native tensor allocator and descriptor methods
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tools/extract_r09_fswin_shared_tensor.py \
            encore-active/eden-vulkan/nr_rdna2_fswin_gpu_tensors.cpp \
            .build-r09-fswin/r09_fswin_shared_tensor_extracted.h
          for cxx in g++ clang++; do
            "$cxx" -std=c++20 -O1 -Wall -Wextra -Werror -UNDEBUG \
              -fsanitize=undefined -fno-sanitize-recover=all \
              -DEDEN_R09_MIN_FSWIN_SCRATCH_POOL_EXPERIMENTAL=1 \
              -I.build-r09-fswin \
              -Iencore-active/eden-vulkan/include \
              tools/test_r09_fswin_shared_tensor_extracted.cpp \
              -o ".build-r09-fswin/native-${cxx}"
            UBSAN_OPTIONS=halt_on_error=1 \
              ".build-r09-fswin/native-${cxx}"
            echo "R09_FSWIN_SCRATCH_NATIVE_CPP_CI_PASS cxx=${cxx}"
          done
          echo R09_FSWIN_SCRATCH_EXTRACTED_NATIVE_PASS_NOT_FULL_VENDOR_COMPILE
          echo R09_FSWIN_SCRATCH_GPU_SYNC_NOT_QUALIFIED_RUNTIME_DISABLED

  authentic-native-syntax:
    name: Three REAL FSwin C++ TUs (macro OFF/ON, no PS5 build)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact FSwin candidate vendor PR SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: candidate
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          submodules: false
          persist-credentials: false
      - name: Checkout reviewed Encore source and all PINNED deps
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: niakw/ProsperoEden-Encore
          ref: 0ad39a21b1de67f9ff055d6fd6f1f7c97dde12d5
          path: encore
          fetch-depth: 1
          submodules: recursive
          persist-credentials: false
      - name: Temporarily stage exact scratch candidate without touching the engine pin
        shell: bash
        run: |
          set -euo pipefail
          pinned=22b69d6053db41b74edac2633c012f925b84f69e
          candidate="$(git -C candidate rev-parse HEAD)"
          test "$(git -C encore rev-parse HEAD:vendor)" = "$pinned"
          test "$(git -C encore/vendor rev-parse HEAD)" = "$pinned"
          git -C encore/vendor -c credential.helper= fetch --quiet --depth=1 origin "$candidate"
          git -C encore/vendor checkout --quiet --detach "$candidate"
          test "$(git -C encore/vendor rev-parse HEAD)" = "$candidate"
          test "$(git -C encore rev-parse HEAD:vendor)" = "$pinned"
          test -f encore/vendor/encore-active/eden-vulkan/include/rdna2_nr_fswin_scratch_pool_policy.h
          echo "R09_FSWIN_AUTHENTIC_TU_PAIR encore=$(git -C encore rev-parse HEAD) vendor_candidate=$candidate pinned_submodule=$pinned"
      - name: Install host Vulkan, SPIR-V and FFmpeg headers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            clang glslang-tools spirv-tools libvulkan-dev \
            libavcodec-dev libavutil-dev libswscale-dev
      - name: Syntax-check exact three native FSwin source owners twice
        shell: bash
        working-directory: encore
        run: |
          set -euo pipefail
          R09_FSWIN_NATIVE_TU_DUAL=1 \
            python3 -B tools/graphics/check-rdna2-neural-vulkan-tus.py
          test "$(git rev-parse HEAD:vendor)" = "22b69d6053db41b74edac2633c012f925b84f69e"
          echo R09_FSWIN_AUTHENTIC_CPP_SYNTAX_PASS_NO_PS5_BUILD_NO_PIN_CHANGE
