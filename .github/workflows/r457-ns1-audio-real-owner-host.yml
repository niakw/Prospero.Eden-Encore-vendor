name: R457 NS1 audio unready memory real-owner host
on:
  push:
    branches:
      - integration/r457-audio-readiness-real-owner-20261112
    paths:
      - 'encore-active/eden-core/overrides/core/memory.h'
      - 'encore-active/eden-core/src/core/memory_native_*.cpp'
      - 'encore-active/eden-core/src/audio_core/device/device_session.cpp'
      - 'tools/ns1/check_r457_audio_unready_host.py'
      - '.github/workflows/r457-ns1-audio-real-owner-host.yml'
  pull_request:
    paths:
      - 'encore-active/eden-core/**'
      - 'tools/ns1/check_r457_audio_unready_host.py'
      - '.github/workflows/r457-ns1-audio-real-owner-host.yml'
permissions:
  contents: read
jobs:
  host-readiness:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Execute source ownership and C++ readiness oracle
        run: python3 -B tools/ns1/check_r457_audio_unready_host.py
