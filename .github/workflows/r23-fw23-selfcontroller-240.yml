name: R23 FW23 selected SelfController 240 source parity
on:
  push:
    branches:
      - research/r23-fw23-selfcontroller-240-20261111
  pull_request:
    paths:
      - "encore-active/ns2-runtime/self_controller/core/hle/service/am/service/self_controller.cpp"
      - "tests/r23_fw23_selfcontroller_240.py"
      - ".github/workflows/r23-fw23-selfcontroller-240.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -B tests/r23_fw23_selfcontroller_240.py
