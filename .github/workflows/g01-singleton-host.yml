name: G01 fail-closed singleton texture descriptor host guard
on:
  push:
    branches: [main]
    paths:
      - 'encore-active/ns2-runtime/ampere/shader_recompiler/backend/spirv/emit_spirv_image.cpp'
      - 'tools/ns2/check_g01_singleton_host.py'
      - '.github/workflows/g01-singleton-host.yml'
  pull_request:
    paths:
      - 'encore-active/ns2-runtime/ampere/shader_recompiler/backend/spirv/emit_spirv_image.cpp'
      - 'tools/ns2/check_g01_singleton_host.py'
      - '.github/workflows/g01-singleton-host.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-owner:
    name: G01 real SPIR-V singleton descriptor refusal, Clang/GCC
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -B tools/ns2/check_g01_singleton_host.py
