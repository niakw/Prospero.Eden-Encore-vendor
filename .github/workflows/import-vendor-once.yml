name: Import exact pinned Encore vendor snapshot

on:
  push:
    paths:
      - .github/workflows/import-vendor-once.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: exact-encore-vendor-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Check out destination vendor repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1

      - name: Import and verify the exact pinned source Git tree
        shell: bash
        env:
          SOURCE_REPO: https://github.com/niakw/Prospero.Eden-Encore.git
          SOURCE_SHA: 565e69f0d0edf2213ad313743da79e6a8b6173c6
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config core.autocrlf false
          source_dir="${RUNNER_TEMP}/encore-source"
          git clone --filter=blob:none --single-branch --branch dev/ps5-sparse-jit --no-checkout "${SOURCE_REPO}" "${source_dir}"
          git -C "${source_dir}" sparse-checkout init --cone
          git -C "${source_dir}" sparse-checkout set vendor
          git -C "${source_dir}" checkout --detach "${SOURCE_SHA}"
          test "$(git -C "${source_dir}" rev-parse HEAD)" = "${SOURCE_SHA}"
          expected="$(git -C "${source_dir}" rev-parse HEAD:vendor)"
          echo "Source Encore commit: ${SOURCE_SHA}"
          echo "Expected vendor Git tree: ${expected}"
          test -f "${source_dir}/vendor/README.md"
          # All source content is kept verbatim; disable any text/EOL rewrite.
          printf '* -text\n' > .gitattributes
          rsync -a "${source_dir}/vendor/" ./
          git add --all --force
          # Destination-only metadata is intentionally excluded from the
          # verification index, without removing it from the actual commit.
          cp .git/index "${RUNNER_TEMP}/vendor-audit.index"
          GIT_INDEX_FILE="${RUNNER_TEMP}/vendor-audit.index" git rm -r --cached -q -- .github LICENSE .gitattributes
          actual="$(GIT_INDEX_FILE="${RUNNER_TEMP}/vendor-audit.index" git write-tree)"
          echo "Actual imported Git tree: ${actual}"
          test "${expected}" = "${actual}" || { echo 'ERROR: vendor content or file modes differ. Refusing to push.'; exit 1; }
          echo "Exact Git tree match confirmed: ${actual}"
          git diff --cached --shortstat
          if git diff --cached --quiet; then
            echo 'Already imported; nothing to commit.'
            exit 0
          fi
          git commit -m "vendor: import byte-identical Encore vendor from ${SOURCE_SHA}" -m "Original vendor tree SHA: ${expected}"
          git push origin HEAD:main
          echo "Imported commit: $(git rev-parse HEAD)"
