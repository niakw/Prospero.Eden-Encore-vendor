name: NS2 GetInfo 29/30 VAMM region source contract

on:
  pull_request:
    paths:
      - 'encore-active/eden/src/core/hle/kernel/svc_types.h'
      - 'encore-active/eden/src/core/hle/kernel/svc/svc_info.cpp'
      - 'encore-active/ns2-runtime/kernel/core/hle/kernel/k_address_space_info.cpp'
      - 'tests/ns2_getinfo_vamm_region_source.py'
      - '.github/workflows/ns2-getinfo-vamm-region-host.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check bounded InfoType 29/30 VAMM contract
        run: python3 -B tests/ns2_getinfo_vamm_region_source.py
