name: G10 QMD3 release target real-owner preflight
on:
  push:
    branches: [main]
    paths:
      - 'encore-active/ns2-runtime/gpu_dispatch/video_core/engines/puller.cpp'
      - 'tools/ns2/check_g10_qmd_release_backing_host.py'
      - 'tools/ns2/check_g10_qmd_release_callback_host.py'
      - '.github/workflows/g10-qmd-release-backing.yml'
  pull_request:
    paths:
      - 'encore-active/ns2-runtime/gpu_dispatch/video_core/engines/puller.cpp'
      - 'tools/ns2/check_g10_qmd_release_backing_host.py'
      - 'tools/ns2/check_g10_qmd_release_callback_host.py'
      - '.github/workflows/g10-qmd-release-backing.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-owner:
    name: G10 real QMD3 release target before dispatch Clang/GCC
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -B tools/ns2/check_g10_qmd_release_backing_host.py
      - run: python3 -B tools/ns2/check_g10_qmd_release_callback_host.py
