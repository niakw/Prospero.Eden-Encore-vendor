name: GPU multi-level page table bounds (host)
on:
  pull_request:
    paths:
      - "encore-active/eden-core/src/common/multi_level_page_table.cpp"
      - "tests/ps5_gpu_page_table_bounds_host.py"
      - ".github/workflows/gpu-page-table-bounds-host.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  table-bounds:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: python3 -B tests/ps5_gpu_page_table_bounds_host.py
