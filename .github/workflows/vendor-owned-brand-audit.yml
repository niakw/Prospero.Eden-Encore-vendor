name: Encore vendor owned-comment and workflow display audit
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vendor-owned-brand-audit.yml'
      - '.github/scripts/check-vendor-brand-display.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-comment-inventory:
    name: Inventory authored comments and visible CI labels
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout maintained vendor sources (sparse, no binaries)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout: |
            .github/scripts
            .github/workflows
            encore-active
            README.md
      - name: Audit human-readable vendor naming without changing technical owners
        run: python3 -B .github/scripts/check-vendor-brand-display.py
