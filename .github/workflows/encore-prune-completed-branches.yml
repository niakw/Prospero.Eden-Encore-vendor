name: Prune reviewed and completed vendor branches
on:
  push:
    branches: [main]
    paths: ['.github/workflows/encore-prune-completed-branches.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prune:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    permissions:
      contents: write
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Remove unchanged heads only after proof of merge or no unique commits
        shell: bash
        run: |
          set -euo pipefail
          # Preserve Dependabot security work and any unlisted active branches.
          while IFS='|' read -r branch expected; do
            [[ -n "$branch" ]] || continue
            current="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${branch}" --jq '.object.sha' 2>/dev/null || true)"
            if [[ -z "$current" ]]; then echo "Already absent: $branch"; continue; fi
            if [[ "$current" != "$expected" ]]; then echo "Ref advanced, preserving $branch"; continue; fi
            open="$(gh api "repos/${GITHUB_REPOSITORY}/pulls?state=open&head=niakw:${branch}&per_page=100" --jq 'length')"
            if [[ "$open" != "0" ]]; then echo "Open PR, preserving $branch"; continue; fi
            merged="$(gh api "repos/${GITHUB_REPOSITORY}/pulls?state=closed&head=niakw:${branch}&per_page=100" | jq --arg sha "$expected" '[.[] | select(.merged_at != null and .head.sha == $sha)] | length')"
            ahead="$(gh api "repos/${GITHUB_REPOSITORY}/compare/main...${branch}" --jq '.ahead_by' 2>/dev/null || true)"
            if [[ "$merged" == "0" && "$ahead" != "0" ]]; then echo "Unmerged changes preserved: $branch"; continue; fi
            again="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${branch}" --jq '.object.sha' 2>/dev/null || true)"
            if [[ "$again" != "$expected" ]]; then echo "Ref moved during check: $branch"; continue; fi
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}"
            echo "Deleted: $branch"
          done <<'PINNED_HEADS'
          fix/g10-qmd-reduction-late-unmap-20261110|e1b6f7434c9912788fbb97114025c06f51a1577e
          fix/g10-qmd-release-remapped-backing-20261110|dddc7e2e1e99a7f6e6eb6f79ba81415e477382fa
          fix/h01-kprocess-active-resource-limit-null-20261110|9ca2fa2a7c0e9637a121d7675cd4ab8f176c0797
          fix/h01-kprocess-resource-limit-oom-20261110|156c9961b06ea84daaafd84d4cce4b2e38896059
          fix/h01-late-run-rollback-pages-20261110|03d2d78c6945013546b11465b33b2034598cf17f
          fix/h01-rollback-executed-finalizer-witness-20261110|b63baede3409fa70d6e95813fcf08f2a637f07b0
          fix/h01-romfs-rollback-without-trace-20261110|d7a8b9167070500835717a08e0b0f4eea2c3c520
          PINNED_HEADS
