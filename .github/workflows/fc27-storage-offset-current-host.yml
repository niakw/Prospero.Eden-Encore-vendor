name: FC27 storage offset current-source audit
on:
  pull_request:
    paths:
      - 'tests/fc27_storage_offset_current_host.py'
      - '.github/workflows/fc27-storage-offset-current-host.yml'
      - 'encore-active/eden/src/shader_recompiler/ir_opt/global_memory_to_storage_buffer_pass.cpp'
      - 'encore-active/eden/src/shader_recompiler/frontend/ir/breadth_first_search.h'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-model:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -B tests/fc27_storage_offset_current_host.py
