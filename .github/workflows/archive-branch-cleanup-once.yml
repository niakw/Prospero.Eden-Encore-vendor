name: One-time preserve old archive heads as tags then clean old branches
on:
  push:
    paths:
      - '.github/workflows/archive-branch-cleanup-once.yml'
permissions:
  contents: write
jobs:
  preserve-and-clean:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Confirm three historical heads, preserve tags, delete obsolete archive branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "Archiving archive/encore-avatar-20261030 at 0abe15411a914c62905535567645ec04c2d5384b"
          tag="archive/encore-avatar-20261030"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '.object.sha' >/tmp/encore-existing-tag 2>/dev/null; then
            test "$(cat /tmp/encore-existing-tag)" = "0abe15411a914c62905535567645ec04c2d5384b"
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$tag" -f sha="0abe15411a914c62905535567645ec04c2d5384b" >/dev/null
          fi
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '.object.sha')" = "0abe15411a914c62905535567645ec04c2d5384b"
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/archive/encore-avatar-20261030"
          echo "Archived and deleted archive/encore-avatar-20261030"
          echo "Archiving archive/encore-feature-20261030 at c62ecbb58555fd71b13f98266e745fe22789111d"
          tag="archive/encore-feature-20261030"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '.object.sha' >/tmp/encore-existing-tag 2>/dev/null; then
            test "$(cat /tmp/encore-existing-tag)" = "c62ecbb58555fd71b13f98266e745fe22789111d"
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$tag" -f sha="c62ecbb58555fd71b13f98266e745fe22789111d" >/dev/null
          fi
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '.object.sha')" = "c62ecbb58555fd71b13f98266e745fe22789111d"
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/archive/encore-feature-20261030"
          echo "Archived and deleted archive/encore-feature-20261030"
          echo "Archiving archive/encore-ns2-20261030 at be590fba64eca04cf134f5aa322f747bf5eba536"
          tag="archive/encore-ns2-20261030"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '.object.sha' >/tmp/encore-existing-tag 2>/dev/null; then
            test "$(cat /tmp/encore-existing-tag)" = "be590fba64eca04cf134f5aa322f747bf5eba536"
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$tag" -f sha="be590fba64eca04cf134f5aa322f747bf5eba536" >/dev/null
          fi
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '.object.sha')" = "be590fba64eca04cf134f5aa322f747bf5eba536"
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/archive/encore-ns2-20261030"
          echo "Archived and deleted archive/encore-ns2-20261030"
