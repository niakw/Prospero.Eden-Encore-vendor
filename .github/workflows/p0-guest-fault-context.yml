name: P0 guest fault owner context (host source)
on:
  pull_request:
    paths:
      - 'encore-active/eden-core/src/core/hle/kernel/physical_core_dev.cpp'
      - 'encore-active/eden-core/src/core/hle/kernel/physical_core_standard.cpp'
      - 'tests/p0_guest_fault_context_source.py'
      - '.github/workflows/p0-guest-fault-context.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -B tests/p0_guest_fault_context_source.py
