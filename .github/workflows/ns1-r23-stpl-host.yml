name: NS1 R23 FW23 stpl service and safe write semantics
on:
  push:
    branches:
      - research/ns1-r23-stpl-hos23-20261111
  pull_request:
    paths:
      - "encore-active/eden-backports/src/core/hle/service/ngc/ngc.cpp"
      - "encore-active/eden-backports/src/core/hle/service/filesystem/fsp/fsp_srv.cpp"
      - "encore-active/eden-core/include/core/hle/service/acc/profile_manager.h"
      - "encore-active/eden-core/include/core/hle/service/ipc_helpers.h"
      - "tests/ns1_r23_119_stpl_host.py"
      - ".github/workflows/ns1-r23-stpl-host.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stpl-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -B tests/ns1_r23_119_stpl_host.py
