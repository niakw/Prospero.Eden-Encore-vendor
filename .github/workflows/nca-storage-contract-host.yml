name: NCA storage ownership and bounded legal reads (host)
on:
  pull_request:
    paths:
      - "encore-active/eden-core/src/core/file_sys/fssystem/**"
      - "tests/ps5_nca_storage_contract_host.py"
      - ".github/workflows/nca-storage-contract-host.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  storage-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: python3 -B tests/ps5_nca_storage_contract_host.py
