name: Retired branch cleanup policy (host only)
on:
  pull_request:
    paths:
      - '.github/workflows/cleanup-merged-pr-branches.yml'
      - '.github/scripts/test-cleanup-retired-branches.py'
      - '.github/workflows/cleanup-retired-branches-host.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -B .github/scripts/test-cleanup-retired-branches.py
