name: NS2 pre-kernel generation source qualification
on:
  pull_request:
    paths:
      - 'encore-active/ns2-runtime/process/core/core.cpp'
      - 'encore-active/ns2-runtime/process/core/hle/kernel/k_process.cpp'
      - 'encore-active/ns2-runtime/metadata/core/file_sys/program_metadata.cpp'
      - 'encore-active/ns2-runtime/metadata/core/loader/deconstructed_rom_directory.cpp'
      - 'tests/ns2-prekernel-generation-source.py'
      - 'tests/ns2-kprocess-memory-budget-source.py'
      - '.github/workflows/ns2-prekernel-generation-host.yml'
  push:
    branches: [main]
    paths:
      - 'encore-active/ns2-runtime/process/core/core.cpp'
      - 'encore-active/ns2-runtime/process/core/hle/kernel/k_process.cpp'
      - 'encore-active/ns2-runtime/metadata/core/file_sys/program_metadata.cpp'
      - 'encore-active/ns2-runtime/metadata/core/loader/deconstructed_rom_directory.cpp'
      - 'tests/ns2-prekernel-generation-source.py'
      - 'tests/ns2-kprocess-memory-budget-source.py'
      - '.github/workflows/ns2-prekernel-generation-host.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify pre-kernel generation and full loader admission
        run: python3 -B tests/ns2-prekernel-generation-source.py
      - name: Verify exact upstream KProcess NS2 memory budget
        run: python3 -B tests/ns2-kprocess-memory-budget-source.py
