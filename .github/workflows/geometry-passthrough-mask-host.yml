name: Emulated geometry passthrough attribute mask (host)
on:
  pull_request:
    paths:
      - "encore-active/eden-shader/src/shader_recompiler/frontend/maxwell/translate_program.cpp"
      - "tests/ps5_geometry_passthrough_mask_host.py"
      - "tests/ns1_r23_72_subgroup_host.py"
      - ".github/workflows/geometry-passthrough-mask-host.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  geometry-mask:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: python3 -B tests/ps5_geometry_passthrough_mask_host.py
      - run: python3 -B tests/ns1_r23_72_subgroup_host.py
