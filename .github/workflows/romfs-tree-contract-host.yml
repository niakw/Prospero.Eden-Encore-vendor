name: RomFS tree traversal contract (host)
on:
  pull_request:
    paths:
      - "encore-active/eden-core/src/core/file_sys/romfs.cpp"
      - "tests/ps5_romfs_tree_contract_host.py"
      - ".github/workflows/romfs-tree-contract-host.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tree-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: python3 -B tests/ps5_romfs_tree_contract_host.py
