name: P0 MKW sparse blocking boundaries (host source)
on:
  pull_request:
    paths:
      - 'encore-active/eden/src/core/hle/service/am/service/gpu_worker.cpp'
      - 'encore-active/eden/src/core/loader/ns2_svc_trace.h'
      - 'encore-active/eden/src/core/hle/kernel/svc.cpp'
      - 'tests/p0_mkw_blocking_boundaries_source.py'
      - '.github/workflows/p0-mkw-blocking-boundaries.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -B tests/p0_mkw_blocking_boundaries_source.py
