name: NS1 C04 maintained JIT/page source parity (no PS5 build)
on:
  push:
    branches:
      - research/ns1-c04-jit-page-sign-20261111
  pull_request:
    paths:
      - "encore-active/eden-header-hygiene/include/common/page_table.h"
      - "encore-active/eden-core/src/dynarmic/backend/x64/**"
      - "tests/c04_jit_page_source.py"
      - ".github/workflows/ns1-c04-jit-source.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  c04-exact-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Exact source provenance and no duplicate/incompatible JIT patch
        run: python3 -B tests/c04_jit_page_source.py
