name: FC27 one-page descriptor read fast path
on:
  pull_request:
    paths:
      - 'encore-active/eden/src/video_core/texture_cache/descriptor_table.h'
      - 'tests/fc27_descriptor_page_fastpath_host.py'
      - '.github/workflows/fc27-descriptor-page-fastpath.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-model:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -B tests/fc27_descriptor_page_fastpath_host.py
