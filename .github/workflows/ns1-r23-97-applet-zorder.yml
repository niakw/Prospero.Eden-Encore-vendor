name: NS1 R23 applet closed overlay z-order (host)
on:
  push:
    branches:
      - research/ns1-r23-applet-zorder-20261111
  pull_request:
    paths:
      - "encore-active/eden-core/src/core/hle/service/am/window_system.cpp"
      - "tests/ns1_r23_97_applet_zorder.py"
      - ".github/workflows/ns1-r23-97-applet-zorder.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  closed-overlay-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -B tests/ns1_r23_97_applet_zorder.py
