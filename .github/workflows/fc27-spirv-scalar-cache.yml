name: FC27 SPIR-V scalar constant cache source proof
on:
  pull_request:
    paths:
      - 'encore-active/eden-shader/include/shader_recompiler/backend/spirv/spirv_emit_context.h'
      - 'tests/fc27_spirv_scalar_cache_source.py'
      - '.github/workflows/fc27-spirv-scalar-cache.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -B tests/fc27_spirv_scalar_cache_source.py
