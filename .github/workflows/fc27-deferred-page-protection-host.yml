name: FC27 synchronous page-protection rollback (host only)

on:
  push:
    branches: [main]
    paths:
      - 'encore-active/eden-core/overrides/core/device_memory_manager.inc'
      - 'encore-active/eden-vulkan/vulkan_rasterizer.cpp'
      - 'encore-active/ns2-astc/include/video_core/texture_cache/texture_cache.h'
      - 'tests/fc27_deferred_page_protection_host.py'
      - '.github/workflows/fc27-deferred-page-protection-host.yml'
  pull_request:
    paths:
      - 'encore-active/eden-core/overrides/core/device_memory_manager.inc'
      - 'encore-active/eden-vulkan/vulkan_rasterizer.cpp'
      - 'tests/fc27_deferred_page_protection_host.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synchronous-protection-and-unmap:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify selected cache ownership and compile synchronous method with sanitizers
        run: python3 -B tests/fc27_deferred_page_protection_host.py
      - name: Record evidence boundary
        run: |
          printf '%s\n' 'Controlled #194 rollback: host-only; PS5 FC27 image correctness and FPS unverified.' >> "$GITHUB_STEP_SUMMARY"
