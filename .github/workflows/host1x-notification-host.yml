name: Host1x published-counter wake regression (host)
on:
  pull_request:
    paths:
      - "encore-active/eden-core/src/video_core/host1x/syncpoint_manager.cpp"
      - "tests/ps5_host1x_wait_notification_host.py"
      - ".github/workflows/host1x-notification-host.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host1x-notification:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: python3 -B tests/ps5_host1x_wait_notification_host.py
