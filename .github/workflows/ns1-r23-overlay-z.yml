name: NS1 R23 Applet overlay open-only layer z-order
on:
  push:
    branches:
      - research/ns1-r23-applet-overlay-zorder-20261111
  pull_request:
    paths:
      - "encore-active/eden-core/src/core/hle/service/am/window_system.cpp"
      - "tests/ns1_r23_97_overlay_z.py"
      - ".github/workflows/ns1-r23-overlay-z.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  overlay-z:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -B tests/ns1_r23_97_overlay_z.py
