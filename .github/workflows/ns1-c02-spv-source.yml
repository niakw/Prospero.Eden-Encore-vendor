name: NS1 C02 shared SPIR-V NaN fragment source (host only)
on:
  push:
    branches:
      - research/ns1-c02-shared-spirv-nan-20261111
  pull_request:
    paths:
      - "encore-active/ns2-runtime/ampere/shader_recompiler/backend/spirv/emit_spirv_context_get_set.cpp"
      - "tests/c02_spirv_fragment_nan.py"
      - ".github/workflows/ns1-c02-spv-source.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  c02-shared-fragment-guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check pinned source delta, finite/NaN output with Clang ASan/UBSan
        run: python3 -B tests/c02_spirv_fragment_nan.py
