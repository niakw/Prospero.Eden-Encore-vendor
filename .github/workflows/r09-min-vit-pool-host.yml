name: R09 Min ViT pool — isolated vendor host proof

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/r09-min-vit-pool-host.yml'
      - 'encore-active/eden-vulkan/nr_rdna2_frame_session.cpp'
      - 'encore-active/eden-vulkan/include/rdna2_nr_vit_min_pool_policy.h'
      - 'tools/test_r09_min_vit_pool_policy.cpp'
      - 'tools/check_r09_min_vit_shader_footprint.py'
      - 'encore-active/eden-vulkan/r09_rdna2_nr/vit_qkv_norm_rdna2.comp'
      - 'encore-active/eden-vulkan/r09_rdna2_nr/vit_attention_rdna2.comp'
      - 'encore-active/eden-vulkan/r09_rdna2_nr/vit_attention_tiled_min_rdna2.comp'
      - 'tools/extract_r09_min_vit_allocator.py'
      - 'tools/test_r09_min_vit_allocator_extracted.cpp'
      - 'tools/check_r09_min_vit_optimality_host.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r09-min-vendor-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

jobs:
  host-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - name: Checkout exact PR SHA without submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          submodules: false
          persist-credentials: false
      - name: Verify default allocator is unchanged when macro is absent
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          s=Path('encore-active/eden-vulkan/nr_rdna2_frame_session.cpp').read_text()
          gate='#if defined(EDEN_R09_MIN_VIT_POOL_EXPERIMENTAL) && EDEN_R09_MIN_VIT_POOL_EXPERIMENTAL'
          assert s.count(gate)==2
          assert s.count('[[nodiscard]] bool MakeVitBuffers(')==1
          body=s.split('[[nodiscard]] bool MakeVitBuffers(',1)[1]
          assert body.count(gate)==1
          fallback=body.split('#else',1)[1].split('#endif',1)[0]
          for x in ('b.input=i?result.back().output:Make(plane);',
                    'b.hidden=Make(plane*4u);',
                    'b.output=Make(plane);',
                    'b.value=Make(plane*4u);'):
              assert x in fallback, x
          assert 'MakeVitMinPoolLayout(vit_route.tokens)' in body
          print('R09_MIN_VENDOR_DEFAULT_ALLOCATOR_PRESERVED')
          PY
      - name: GCC Clang C++20 UBSan positive and negative checks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .build-r09-min
          for cxx in g++ clang++; do
            for enabled in 0 1; do
              "$cxx" -std=c++20 -O1 -Wall -Wextra -Werror -UNDEBUG \
                -fsanitize=undefined -fno-sanitize-recover=all \
                -DEDEN_R09_MIN_VIT_POOL_EXPERIMENTAL="$enabled" \
                -Iencore-active/eden-vulkan/include \
                tools/test_r09_min_vit_pool_policy.cpp \
                -o ".build-r09-min/pool-${cxx}-${enabled}"
              UBSAN_OPTIONS=halt_on_error=1 ".build-r09-min/pool-${cxx}-${enabled}"
              echo "R09_MIN_VENDOR_HOST_PASS ${cxx} macro=${enabled}"
            done
          done
          echo R09_MIN_VENDOR_LAYOUT_ONLY_NO_PS5_BUILD_NO_RUNTIME_ENABLEMENT

      - name: Compile the exact guarded native MakeVitBuffers body with allocation stubs
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/extract_r09_min_vit_allocator.py \
            encore-active/eden-vulkan/nr_rdna2_frame_session.cpp \
            .build-r09-min/r09_min_vit_allocator_extracted.h
          for cxx in g++ clang++; do
            for profile in default 4 5 6 12; do
              args=()
              if [[ "$profile" == default ]]; then
                args+=(-DEDEN_R09_MIN_VIT_POOL_EXPERIMENTAL=0)
              else
                args+=(-DEDEN_R09_MIN_VIT_POOL_EXPERIMENTAL=1
                       "-DEDEN_R09_MIN_VIT_POOL_SCRATCH_PLANES=$profile")
              fi
              "$cxx" -std=c++20 -O1 -Wall -Wextra -Werror -UNDEBUG \
                -fsanitize=undefined -fno-sanitize-recover=all \
                "${args[@]}" -I.build-r09-min \
                -Iencore-active/eden-vulkan/include \
                tools/test_r09_min_vit_allocator_extracted.cpp \
                -o ".build-r09-min/native-${cxx}-${profile}"
              UBSAN_OPTIONS=halt_on_error=1 \
                ".build-r09-min/native-${cxx}-${profile}"
              echo "R09_MIN_NATIVE_ALLOCATOR_PROFILE_PASS $cxx $profile"
            done
          done
          echo R09_MIN_NATIVE_METHOD_EXTRACTED_CPP_ALL_PROFILES_PASS

      - name: Verify exact producer/consumer GPU packed FP8 address bounds
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tools/check_r09_min_vit_shader_footprint.py

      - name: Compile and SPIR-V validate isolated 32-key shared-memory attention
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends glslang-tools spirv-tools
          mkdir -p .build-r09-min
          glslangValidator -V --target-env vulkan1.1 -S comp \
            encore-active/eden-vulkan/r09_rdna2_nr/vit_attention_tiled_min_rdna2.comp \
            -o .build-r09-min/vit_attention_tiled_min.spv
          spirv-val --target-env vulkan1.1 \
            .build-r09-min/vit_attention_tiled_min.spv
          spirv-dis .build-r09-min/vit_attention_tiled_min.spv \
            > .build-r09-min/vit_attention_tiled_min.spvasm
          grep -Eq 'OpExecutionMode .* LocalSize 32 1 1' \
            .build-r09-min/vit_attention_tiled_min.spvasm
          grep -Fq OpControlBarrier .build-r09-min/vit_attention_tiled_min.spvasm
          ! grep -Eq 'OpCapability (CooperativeMatrix|RayTracingKHR)' \
            .build-r09-min/vit_attention_tiled_min.spvasm
          echo R09_MIN_VIT_TILED_ATTENTION_SPIRV_ONLY_PASS_NO_MODEL_GPU_TEST

      - name: Prove source-constrained minimum memory and reject six unsafe mutations
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tools/check_r09_min_vit_optimality_host.py
          echo R09_MIN_VIT_OPTIMALITY_LOWER_BOUND_ONLY_NO_GPU_CLAIM
