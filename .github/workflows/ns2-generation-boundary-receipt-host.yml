name: NS2 generation boundary receipt host
on:
  pull_request:
    paths:
      - 'encore-active/eden/src/core/core.cpp'
      - 'encore-active/eden/src/core/loader/deconstructed_rom_directory.cpp'
      - 'tests/ns2-generation-boundary-log-source.py'
      - '.github/workflows/ns2-generation-boundary-receipt-host.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify effective and early generation receipts
        run: python3 -B tests/ns2-generation-boundary-log-source.py
