name: H05 decoder real-owner syncpoint exhaustion
on:
  push:
    branches: [main]
    paths:
      - 'encore-active/ns2-runtime/video_decoder/core/hle/service/am/service/graphics_video_decoder_session.cpp'
      - 'tools/ns2/check_h05_video_syncpoint_exhaustion_host.py'
      - '.github/workflows/h05-video-syncpoint-exhaustion.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-owner:
    name: H05 video fence zero-id fail-closed (Clang/GCC)
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -B tools/ns2/check_h05_video_syncpoint_exhaustion_host.py
