name: NS1 R23 SSL coherent source and bounded Peek
on:
  push:
    branches:
      - research/ns1-r23-ssl-ipc-20261111
  pull_request:
    paths:
      - "encore-active/eden-core/src/core/hle/service/ssl/**"
      - "tests/ns1_r23_120_ssl_host.py"
      - ".github/workflows/ns1-r23-120-ssl-host.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ssl-openssl-ipc:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -B tests/ns1_r23_120_ssl_host.py
