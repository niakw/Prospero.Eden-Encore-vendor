name: PS5 cold shader warm manifest host
on:
  pull_request:
    paths:
      - 'encore-active/eden-vulkan/vk_pipeline_cache_cost.cpp'
      - 'encore-active/eden-vulkan/include/video_core/renderer_vulkan/vk_pipeline_cache.h'
      - 'tests/ps5_cold_shader_warm_manifest_source.py'
      - '.github/workflows/ps5-cold-shader-warm-manifest-host.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: python3 -B tests/ps5_cold_shader_warm_manifest_source.py
