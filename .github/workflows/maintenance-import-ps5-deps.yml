name: Capture pinned PS5 sources into vendor (maintenance branch only)
on:
  push:
    branches: [maintenance/internalize-ps5-deps-20261110]
    paths: ['.github/workflows/maintenance-import-ps5-deps.yml']
permissions:
  contents: write
concurrency:
  group: vendor-ps5-dependency-capture
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          filter: blob:none
          submodules: false
          persist-credentials: true
          sparse-checkout: |
            .github
            .gitmodules
            docs
            encore-active/libwebp
            encore-active/PS5_MihawkGen
            encore-active/PS5_FSR3OpticalFlow
      - name: Convert Gitlinks into exact in-repository source trees
        shell: bash
        env:
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          scratch="$(mktemp -d)"
          trap 'rm -rf "$scratch"' EXIT
          capture() {
            local upstream="$1" revision="$2" target="$3" alias="$4" required="$5"
            local checkout="$scratch/$alias"
            git -c credential.helper= clone --quiet --filter=blob:none \
              "https://github.com/$upstream.git" "$checkout"
            git -C "$checkout" fetch --quiet --no-tags --depth=1 origin "$revision"
            git -C "$checkout" checkout --quiet --detach "$revision"
            test "$(git -C "$checkout" rev-parse HEAD)" = "$revision"
            if git -C "$checkout" ls-tree -r HEAD | grep -q '^160000 '; then
              echo "Refusing nested external Gitlinks in $upstream" >&2
              exit 1
            fi
            mkdir -p "$target"
            rsync -a --exclude='/.git/' "$checkout/" "$target/"
            python3 - "$target" <<'PY_SAFETY'
          import os, sys
          from pathlib import Path
          root = Path(sys.argv[1]).resolve()
          for p in root.rglob("*"):
              if p.is_symlink():
                  dest = os.readlink(p)
                  if os.path.isabs(dest) or not (p.parent / dest).resolve().is_relative_to(root):
                      raise SystemExit("Unsafe vendored symlink: " + str(p))
          PY_SAFETY
            test -f "$target/$required"
            echo "Captured $upstream at $revision"
          }
          git rm -f --cached encore-active/libwebp
          rm -rf encore-active/libwebp
          git rm -f .gitmodules
          capture mihawk-99/PS5_MihawkGen \
            c57232a9f16bcb6df5fe07c9bb631518f2b1cc0e \
            encore-active/PS5_MihawkGen mihawk framegen/models/network.fgw
          capture Swordpdf/ps5-framegen \
            64362101757cdd6f7df9eeb984cb53f03f1fbfca \
            encore-active/PS5_FSR3OpticalFlow optical src/framegen/fg_shaders.inc
          capture webmproject/libwebp \
            4fa21912338357f89e4fd51cf2368325b59e9bd9 \
            encore-active/libwebp webp CMakeLists.txt
          echo '31ecc7d69af1e9defd62b9abad71bc3430cd8a0a4d2f4eafcabaafa48c34bf6b  encore-active/PS5_MihawkGen/framegen/models/network.fgw' | sha256sum -c -
          test "$(wc -c < encore-active/PS5_MihawkGen/framegen/models/network.fgw)" -eq 1757240
          test -f encore-active/PS5_MihawkGen/LICENSE.md
          test -f encore-active/PS5_MihawkGen/THIRD_PARTY_NOTICES.txt
          test -f encore-active/PS5_FSR3OpticalFlow/COPYING
          test -f encore-active/libwebp/COPYING
          test -f encore-active/libwebp/PATENTS
          grep -q 'version 1.6.0' encore-active/libwebp/NEWS
          mkdir -p docs
          cat > docs/PS5_INTERNAL_DEPENDENCY_ORIGINS_2026-11-10.md <<'EOF'
          # Internal PS5 dependency source provenance

          The three paths below are ordinary Git tracked files in vendor, not
          external Git submodules. Do not assume PS5 device qualification.

          | Path in vendor | Original project | Exact upstream SHA |
          | --- | --- | --- |
          | encore-active/PS5_MihawkGen | https://github.com/mihawk-99/PS5_MihawkGen | c57232a9f16bcb6df5fe07c9bb631518f2b1cc0e |
          | encore-active/PS5_FSR3OpticalFlow | https://github.com/Swordpdf/ps5-framegen | 64362101757cdd6f7df9eeb984cb53f03f1fbfca |
          | encore-active/libwebp | https://github.com/webmproject/libwebp | 4fa21912338357f89e4fd51cf2368325b59e9bd9 (v1.6.0) |

          MihawkGen includes its GPL/MIT and model-distillation credits, and the
          original network model with SHA-256
          31ecc7d69af1e9defd62b9abad71bc3430cd8a0a4d2f4eafcabaafa48c34bf6b.
          FSR3 Optical Flow carries upstream and AMD notices; libwebp retains
          COPYING and PATENTS. libwebp was previously a v1.5.0 external gitlink
          at a4d7a715337ded4451fec90ff8ce79728e04126c. Updating to 1.6.0
          is a separate, unqualified version change limited to this branch.

          The engine must continue to point at its existing vendor gitlink until
          the new source paths, host tests, and security checks pass. This branch
          never advances main or builds a native PS5 release.
          EOF
          git add --sparse -A -- encore-active/PS5_MihawkGen \
            encore-active/PS5_FSR3OpticalFlow encore-active/libwebp \
            docs/PS5_INTERNAL_DEPENDENCY_ORIGINS_2026-11-10.md
          test "$(git ls-files --stage encore-active/PS5_MihawkGen | wc -l)" -gt 700
          test "$(git ls-files --stage encore-active/PS5_FSR3OpticalFlow | wc -l)" -gt 55
          test "$(git ls-files --stage encore-active/libwebp | wc -l)" -gt 250
          if git ls-files --stage | grep -q '^160000 '; then
            echo 'Unexpected nested Gitlink remains' >&2
            exit 1
          fi
          git commit -m 'vendor: internalize pinned frame generation and libwebp 1.6.0 sources (no external Gitlinks)'
          git push origin "HEAD:$GITHUB_REF_NAME"
      - name: Print branch-only receipt
        run: git log -1 --format='Import commit %H'
