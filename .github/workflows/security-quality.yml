name: Encore vendor Security & Quality (CodeQL)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/security-quality.yml'
      - '.github/codeql/active-scope.yml'
      - 'encore-active/**'
  pull_request:
    paths:
      - '.github/workflows/security-quality.yml'
      - '.github/codeql/active-scope.yml'
      - 'encore-active/**'
  workflow_dispatch:
  schedule:
    - cron: '21 3 * * 3'
permissions:
  actions: read
  contents: read
  security-events: write
# Do not cancel the only full vendor security pass on every vendor push.
concurrency:
  group: vendor-security-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false
jobs:
  codeql:
    name: Active vendor CodeQL (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: python
            build-mode: none
          - language: c-cpp
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: Initialize audited CodeQL v4
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # pinned v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ./.github/codeql/active-scope.yml
      - name: Run active-source security/quality queries
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # pinned v4
        with:
          category: /language:${{ matrix.language }}/setup:vendor-active
