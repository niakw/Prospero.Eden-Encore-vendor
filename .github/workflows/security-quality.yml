name: Encore vendor Security & Quality (host checks)
# The repository already enables GitHub DEFAULT CodeQL setup.
# Do NOT run a second advanced CodeQL upload; GitHub rejects such SARIF.
# This workflow adds independent conservative source and header checks.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.github/scripts/check-active-security.py'
      - '.github/scripts/check-workflow-security.py'
      - '.github/scripts/audit-maintained-comment-terms.py'
      - '.github/dependabot.yml'
      - 'encore-active/**'
      - 'sources/ps5-mihawkgen/**'
      - 'sources/ps5-fsr3-optical-flow/**'
      - 'sources/libwebp/**'
      - 'tools/check-source-tree-layout.py'
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/scripts/check-active-security.py'
      - '.github/scripts/check-workflow-security.py'
      - '.github/scripts/audit-maintained-comment-terms.py'
      - '.github/dependabot.yml'
      - 'encore-active/**'
      - 'sources/ps5-mihawkgen/**'
      - 'sources/ps5-fsr3-optical-flow/**'
      - 'sources/libwebp/**'
      - 'tools/check-source-tree-layout.py'
  workflow_dispatch:
  schedule:
    - cron: '21 3 * * 3'
permissions:
  contents: read
concurrency:
  group: vendor-security-host-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false
jobs:
  maintained-source-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            .github
            README.md
            docs/PS5_INTERNAL_DEPENDENCY_ORIGINS_2026-11-10.md
            encore-active
            sources/ps5-mihawkgen
            sources/ps5-fsr3-optical-flow
            sources/libwebp
            tools/check-source-tree-layout.py
      - name: Check user-supplied neural model safety and active owners
        run: python3 -B .github/scripts/check-active-security.py
      - name: Verify strict upstream sources / Encore override boundary
        run: python3 -B tools/check-source-tree-layout.py
      - name: Audit pinned workflow actions and read-only token scopes
        run: python3 -B .github/scripts/check-workflow-security.py
      - name: Audit maintained-source comment wording (host)
        run: python3 -B .github/scripts/audit-maintained-comment-terms.py
      - name: Compile bounded model parser and exact model manifest (host)
        run: |
          printf '%s\n' \
            '#include "video_core/renderer_vulkan/nr_rdna2_model_file.h"' \
            '#include "video_core/renderer_vulkan/nr_rdna2_model_manifest.h"' \
            'int main(){ using namespace Eden::Graphics::NeuralRDNA2;' \
            '  return R09OriginalManifest.size()==599u &&' \
            '         R09CompactManifest.size()==255u ? 0 : 1; }' \
            | c++ -x c++ -std=c++20 -Wall -Wextra -Werror -O0 \
              -Iencore-active/eden-vulkan/include -Iencore-active/eden-vulkan/include/video_core/renderer_vulkan \
              -o /tmp/eden-vendor-security-headers -
          /tmp/eden-vendor-security-headers
