name: Graphics profiles integrity
on:
  push:
    branches: [main, feat/graphics-r10-sampler-defaults]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  graphics-profiles:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - name: Validate all profile records and static shader recommendations
        run: python3 tools/audit_graphics_recommendations.py
      - name: Test Switch 2 incremental generator without network
        run: python3 -m unittest discover -s tools -p 'test_sync_switch2_games.py' -v
      - name: Validate NS1 / NS2 catalog partition and four tiers
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          base=Path('.')
          profiles={'minimum','recommended','high','ultra'}
          ids=set()
          ns2=ns1=0
          for path in sorted((base/'games').glob('*.json')):
              data=json.loads(path.read_text(encoding='utf-8'))
              tid=data['title_id']
              assert path.stem==tid and tid not in ids
              ids.add(tid)
              assert set(data['profiles'])==profiles,tid
              for name,p in data['profiles'].items():
                  assert p['settings']['renderer']=='vulkan',(tid,name)
                  anisotropy=p['settings'].get('texture_anisotropy')
                  if anisotropy is None:
                      # Autogenerated game profiles inherit the common tier.
                      assert data['status']=='auto-baseline',(tid,name)
                      plat='ns2/' if tid.startswith('040') else ''
                      general=json.loads((base/'general'/plat/(name+'.json')).read_text())
                      anisotropy=general['settings']['texture_anisotropy']
                  assert anisotropy in {'automatic','default','2x','4x','8x','16x'},(tid,name)
              if tid.startswith('040'):
                  ns2+=1
                  assert data['source_console']=='Nintendo Switch 2',tid
                  assert data['technical_data']['source_game']['target_fps'] is None,tid
              elif tid.startswith('010'):
                  ns1+=1
                  assert data['source_console']=='Nintendo Switch 1',tid
              else: raise AssertionError(tid)
          manifest=json.loads((base/'manifest.json').read_text())
          assert len(manifest['entries'])==len(ids)
          assert {e['title_id'] for e in manifest['entries']}==ids
          assert ns2==467,(ns2,ns1)
          assert ns1==8993,(ns2,ns1)
          editions=json.loads((base/'metadata/ns2_editions.json').read_text())
          assert editions['auto_apply'] is False
          print(f'GRAPHICS_PROFILE_PARTITION_OK NS1={ns1} NS2={ns2}')
          PY